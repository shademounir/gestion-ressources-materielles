name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace backend

      - name: Lint
        run: npm run lint --workspace backend

      - name: Typecheck
        run: npm run typecheck --workspace backend

      - name: Test with coverage
        run: npm run test:cov --workspace backend

      - name: Upload backend coverage
        if: always() && hashFiles('backend/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Build
        run: npm run build --workspace backend

      - name: Upload backend build
        if: success() && hashFiles('backend/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 14
