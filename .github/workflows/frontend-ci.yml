name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspace frontend

      - name: Typecheck
        run: npm run typecheck --workspace frontend

      - name: Test with coverage
        run: npm run test:cov --workspace frontend

      - name: Upload frontend coverage
        if: always() && hashFiles('frontend/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Build
        run: npm run build --workspace frontend

      - name: Upload frontend build
        if: success() && hashFiles('frontend/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 14
