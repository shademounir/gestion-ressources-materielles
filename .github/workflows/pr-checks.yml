name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate --workspace backend

      - name: Backend lint
        run: npm run lint --workspace backend

      - name: Backend typecheck
        run: npm run typecheck --workspace backend

      - name: Backend tests with coverage
        run: npm run test:cov --workspace backend

      - name: Upload backend coverage
        if: always() && hashFiles('backend/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14

      - name: Backend build
        run: npm run build --workspace backend

      - name: Upload backend build
        if: success() && hashFiles('backend/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Frontend lint
        run: npm run lint --workspace frontend

      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend

      - name: Frontend tests with coverage
        run: npm run test:cov --workspace frontend

      - name: Upload frontend coverage
        if: always() && hashFiles('frontend/coverage/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14

      - name: Frontend build
        run: npm run build --workspace frontend

      - name: Upload frontend build
        if: success() && hashFiles('frontend/dist/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 14
